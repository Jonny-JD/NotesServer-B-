spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: never


logging:
  file:
    path: "log/app.log"
  logback:
    rollingpolicy:
      clean-history-on-start: false
      max-file-size: 10MB
      file-name-pattern: log/app.%d{yyyy-MM-dd}.%i.gz
      max-history: 7
      total-size-cap: 100MB

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}