      operationId: getAllByTag
      parameters:
      - name: tag
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteReadDto"
    delete:
      tags:
      - admin-note-controller
      operationId: deleteAllByTag
      parameters:
      - name: tag
        in: path
        required: true
