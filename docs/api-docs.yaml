      responses:
        "204":
          description: No Content
components:
  schemas:
    UserUpdateDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
    UserReadDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
    NoteUpdateDto:
      type: object
      properties:
        title:
          type: string
        tag:
          type: string
        content:
          type: string
        isPrivate:
          type: boolean
    NoteAuthorDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
    NoteReadDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        tag:
          type: string
        content:
          type: string
        author:
          $ref: "#/components/schemas/NoteAuthorDto"
        isPrivate:
          type: boolean
        createdAt:
          type: string
          format: date-time
    UserCreateDto:
      type: object
      properties:
        username:
          type: string
        rawPassword:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
          pattern: "^[a-zA-Z0-9._%+\\-]+@(?!.*xn--)[a-zA-Z0-9.\\-]+\\.[a-zA-Z]{2,}$"
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
      required:
      - email
      - rawPassword
    NoteCreateDto:
      type: object
      properties:
        title:
          type: string
        tag:
          type: string
        content:
          type: string
        author:
          $ref: "#/components/schemas/UserReadDto"
        isPrivate:
          type: boolean
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    NotePreviewDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        tag:
          type: string
        author:
          type: string
        createdAt:
          type: string
          format: date-time
