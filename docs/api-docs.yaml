        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NoteReadDto"
    delete:
      tags:
      - note-rest-controller
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
