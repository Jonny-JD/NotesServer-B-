          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserReadDto"
  /api/v1/notes/{id}:
    get:
      tags:
      - note-rest-controller
      operationId: getById
      parameters:
      - name: id
        in: path
        required: true
