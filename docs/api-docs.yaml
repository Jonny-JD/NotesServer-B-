      operationId: save
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteCreateDto"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NoteReadDto"
  /api/v1/auth/logout:
    post:
      tags:
